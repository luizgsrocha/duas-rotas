<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CaronaFlow</title><link rel="stylesheet" href="style.css?v=rotas-13"></head><body><main><header><div class="top"><div><h1>CaronaFlow</h1><p>Encontre caronas e conexões entre cidades</p></div><div class="theme" aria-label="Tema"><span>Tema</span><div class="theme-toggle" role="group"><button type="button" data-theme-value="light" aria-label="Tema claro" title="Claro">☀️</button><button type="button" data-theme-value="auto" aria-label="Tema automático" title="Automático">◐</button><button type="button" data-theme-value="dark" aria-label="Tema escuro" title="Escuro">🌙</button></div></div></div><small>Versão: rotas-13</small></header><section class="search"><label>Origem <input id="origin" class="city-input" list="cities" autocomplete="off" value="Pirassununga, SP" data-slug="pirassununga"></label><div class="destinations"><label>Destino <input class="destination city-input" list="cities" autocomplete="off" value="Taubaté, SP" data-slug="taubate"></label></div><datalist id="cities"></datalist><button type="button" id="addDestination" class="secondary">+ Adicionar destino</button><label>Data <input id="date" type="date"></label><button id="search">Verificar carona</button></section><section><div id="status"></div><div id="results"></div></section><footer class="credits">Desenvolvido por <strong>Luiz Rocha</strong> · <a href="https://www.instagram.com/luizgsrocha/" target="_blank" rel="noopener noreferrer">@luizgsrocha</a></footer></main><script src="app.js?v=rotas-13"></script></body></html>
