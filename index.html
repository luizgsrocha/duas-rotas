<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CaronaFlow</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><h1>CaronaFlow</h1><p>Pirassununga → Taubaté, direto quando possível. Baldeações quando necessário.</p></header>
<section class="search">
<label>Data <input id="date" type="date"></label>
<label>Saída depois de <input id="time" type="time" value="07:00"></label>
<label>Margem de conexão <select id="margin"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="45">45 min</option><option value="60">60 min</option></select></label>
<button id="search">Procurar rotas</button></section>
<section><div class="toolbar"><h2>Melhores opções</h2><select id="sort"><option value="recommended">Recomendadas</option><option value="fastest">Mais rápidas</option><option value="cheapest">Mais baratas</option></select></div><div id="status"></div><div id="results"></div></section>
</main><script type="module" src="app.js"></script></body></html>
