name: Transfer regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  transfer-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check routing implementation syntax
        run: node --check worker.js && node --check rn-hub.js
      - name: Test direct, connections, RN-HUB, cache and upstream failures
        run: >-
          node --test
          tests/routes.test.mjs
          tests/rn-hub.test.mjs
          tests/segment-cache.test.mjs
          tests/source-feedback.test.mjs
          tests/transfer-diagnostics.test.mjs
