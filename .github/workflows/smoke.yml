name: Published site smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'
permissions:
  contents: read
  checks: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for the Cloudflare production build
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const checkName = 'Workers Builds: rua-nossa';
            for (let attempt = 1; attempt <= 20; attempt++) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                per_page: 100,
              });
              const build = data.check_runs.find(check => check.name === checkName);
              if (build?.status === 'completed') {
                if (build.conclusion !== 'success') {
                  core.setFailed(`Cloudflare build finished with ${build.conclusion}`);
                  return;
                }
                await core.summary
                  .addHeading('Cloudflare production build')
                  .addLink('Build details', build.details_url)
                  .write();
                return;
              }
              core.info(`Waiting for Cloudflare build (${attempt}/20)`);
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            core.setFailed('Cloudflare build did not complete within five minutes');
      - name: Check the published application without changing data
        env:
          SITE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: node scripts/smoke.mjs
