name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check application syntax
        run: |
          node --check worker.js
          node --check rn-hub.js
          node --check app.js
          node --check scripts/audit-national-slugs.mjs
      - name: Test routing and source failures
        run: node --test tests/*.test.mjs tests/*.test.cjs
      - name: Benchmark RN-HUB budgets and reference quality
        run: node scripts/benchmark-rn-hub.mjs

