name: autonomous-cycle

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Somente verificar runner hospedado; não executar Codex nem alterar o repositório'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: autonomous-development
  cancel-in-progress: false

jobs:
  hosted-runner-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify hosted runner without credentials or mutations
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          test -f AGENTS.md
          test -f docs/autonomy/TASK_QUEUE.md
          test -f docs/autonomy/ACTIVATION.md
          echo 'Hosted runner preflight OK: checkout e contratos disponíveis; nenhuma IA executada.'
  cycle:
    if: >-
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) &&
      vars.AUTONOMY_ENABLED == 'true' &&
      vars.AUTONOMY_CIRCUIT_BREAKER != 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail closed until a pinned executor is provisioned
        run: |
          test -x "${AUTONOMY_RUNNER_COMMAND:-}" || {
            echo 'AUTONOMY_RUNNER_COMMAND não configurado; ciclo encerrado sem alteração.'
            exit 1
          }
          exec -- "$AUTONOMY_RUNNER_COMMAND"
        env:
          AUTONOMY_RUNNER_COMMAND: ${{ vars.AUTONOMY_RUNNER_COMMAND }}
