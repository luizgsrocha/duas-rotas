name: Provision and test isolated rollback

on:
  workflow_dispatch:
    inputs:
      workers_subdomain:
        description: 'Subdomínio da conta Workers (ex.: lgsr96)'
        type: string
        required: true
      confirmation:
        description: 'Digite CRIAR WORKER ISOLADO para confirmar'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: isolated-rollback-drill
  cancel-in-progress: false

jobs:
  provision-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: rollback-drill
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ROLLBACK_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: duas-rotas-rollback-drill
      WORKERS_SUBDOMAIN: ${{ inputs.workers_subdomain }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the isolated target and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'CRIAR WORKER ISOLADO'
          test "$WORKER_NAME" = 'duas-rotas-rollback-drill'
          test "$WORKER_NAME" != 'rua-nossa'
          [[ "$WORKERS_SUBDOMAIN" =~ ^[a-z0-9-]+$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy isolated version one
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.47.0 deploy --config wrangler.rollback-drill.toml --var DRILL_VERSION:v1
          npx --yes wrangler@4.47.0 versions list --config wrangler.rollback-drill.toml --json > versions-v1.json
          node -e "const fs=require('fs');const versions=JSON.parse(fs.readFileSync('versions-v1.json'));const newest=versions.at(-1);if(!newest?.id)throw new Error('first version missing');fs.appendFileSync(process.env.GITHUB_ENV,'TARGET_VERSION_ID='+newest.id+'\n')"
      - name: Deploy isolated version two
        id: deploy_v2
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.47.0 deploy --config wrangler.rollback-drill.toml --var DRILL_VERSION:v2
          npx --yes wrangler@4.47.0 versions list --config wrangler.rollback-drill.toml --json > versions-v2.json
          node -e "const fs=require('fs');const versions=JSON.parse(fs.readFileSync('versions-v2.json'));const newest=versions.at(-1);if(!newest?.id||newest.id===process.env.TARGET_VERSION_ID)throw new Error('second version missing');fs.appendFileSync(process.env.GITHUB_ENV,'RESTORE_VERSION_ID='+newest.id+'\n')"
      - name: Verify version two before rollback
        shell: bash
        run: curl --fail --silent --show-error --max-time 20 --retry 2 "https://${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev/" | node -e "let body='';process.stdin.on('data',c=>body+=c).on('end',()=>{if(JSON.parse(body).version!=='v2')process.exit(1)})"
      - name: Roll back to version one
        shell: bash
        run: npx --yes wrangler@4.47.0 rollback "$TARGET_VERSION_ID" --config wrangler.rollback-drill.toml --message 'Isolated rollback drill' --yes
      - name: Verify rolled-back version one
        shell: bash
        run: curl --fail --silent --show-error --max-time 20 --retry 2 "https://${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev/" | node -e "let body='';process.stdin.on('data',c=>body+=c).on('end',()=>{if(JSON.parse(body).version!=='v1')process.exit(1)})"
      - name: Restore version two
        if: always() && steps.deploy_v2.outcome == 'success'
        shell: bash
        run: npx --yes wrangler@4.47.0 rollback "$RESTORE_VERSION_ID" --config wrangler.rollback-drill.toml --message 'Restore after isolated rollback drill' --yes
      - name: Verify restored version two
        if: always() && steps.deploy_v2.outcome == 'success'
        shell: bash
        run: curl --fail --silent --show-error --max-time 20 --retry 2 "https://${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev/" | node -e "let body='';process.stdin.on('data',c=>body+=c).on('end',()=>{if(JSON.parse(body).version!=='v2')process.exit(1)})"

