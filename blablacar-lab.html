<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratório BlaBlaCar · Partiu Carona</title><link rel="stylesheet" href="style.css?v=v0.5.0"></head><body><main><header><h1>🧪 Laboratório BlaBlaCar</h1><p>Teste isolado da busca direta. Não altera a busca normal nem as baldeações.</p></header><section class="search"><label>Origem<input id="origin" value="Taubaté, SP"></label><label>Destino<input id="destination" value="Pirassununga, SP"></label><label>Data<input id="date" type="date" value="2026-10-07"></label><button id="probe">Testar acesso direto</button></section><section><div id="status"></div><pre id="out" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><p><a id="official" target="_blank" rel="noopener noreferrer">Abrir a mesma busca na BlaBlaCar ↗</a></p></section><footer class="credits"><a href="/">← Voltar ao Partiu Carona</a> · Laboratório v0.5.0</footer></main><script>const q=s=>document.querySelector(s);q("#probe").onclick=async()=>{q("#status").textContent="Testando…";q("#out").textContent="";const p=new URLSearchParams({originName:q("#origin").value,destinationName:q("#destination").value,date:q("#date").value});try{const r=await fetch("/api/blablacar-lab?"+p),j=await r.json();q("#status").textContent=j.ok?"Acesso HTTP obtido.":"Acesso não confirmado.";q("#out").textContent=JSON.stringify(j,null,2);if(j.searchUrl){q("#official").href=j.searchUrl;q("#official").style.display=""}}catch(e){q("#status").textContent="Falha no teste.";q("#out").textContent=String(e)}};q("#probe").click()</script></body></html>
