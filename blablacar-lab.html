<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratório BlaBlaCar · Partiu Carona</title><link rel="stylesheet" href="style.css?v=v0.5.1"></head><body><main><header><h1>🧪 Laboratório BlaBlaCar</h1><p>Teste isolado da busca direta. Não altera a busca normal nem as baldeações.</p></header><section class="search"><label>Origem<input id="origin" value="Taubaté, SP"></label><label>Destino<input id="destination" value="Pirassununga, SP"></label><label>Data<input id="date" type="date" value="2026-10-07"></label><button id="probe">Testar acesso direto</button></section><section><div id="status"></div><pre id="out" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><p><a id="official" target="_blank" rel="noopener noreferrer">Abrir a mesma busca na BlaBlaCar ↗</a></p></section><section class="search"><h2>Teste de viagem individual</h2><label>URL /trip<input id="tripUrl" value="https://www.blablacar.com.br/trip?source=CARPOOLING&amp;id=aEz1iz__SumwiAHVNgEMSASEGQHI4wQXC2TqkfMfS6Nw&amp;requested_seats=1&amp;search_origin=HOME&amp;search_uuid=6afa8f16-3538-49d1-b073-be9941ba58b3"></label><button id="tripProbe">Testar URL individual</button></section><section><div id="tripStatus"></div><pre id="tripOut" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></section><footer class="credits"><a href="/">← Voltar ao Partiu Carona</a> · Laboratório v0.5.1</footer></main><script>const q=s=>document.querySelector(s);q("#probe").onclick=async()=>{q("#status").textContent="Testando…";q("#out").textContent="";const p=new URLSearchParams({originName:q("#origin").value,destinationName:q("#destination").value,date:q("#date").value});try{const r=await fetch("/api/blablacar-lab?"+p),j=await r.json();q("#status").textContent=j.ok?"Acesso HTTP obtido.":"Acesso não confirmado.";q("#out").textContent=JSON.stringify(j,null,2);if(j.searchUrl){q("#official").href=j.searchUrl;q("#official").style.display=""}}catch(e){q("#status").textContent="Falha no teste.";q("#out").textContent=String(e)}};q("#probe").click();q("#tripProbe").onclick=async()=>{q("#tripStatus").textContent="Testando viagem individual…";q("#tripOut").textContent="";try{const p=new URLSearchParams({url:q("#tripUrl").value}),r=await fetch("/api/blablacar-trip-lab?"+p),j=await r.json();q("#tripStatus").textContent=j.ok?"A página individual respondeu.":"A página individual não respondeu normalmente.";q("#tripOut").textContent=JSON.stringify(j,null,2)}catch(e){q("#tripStatus").textContent="Falha no teste.";q("#tripOut").textContent=String(e)}};</script></body></html>
